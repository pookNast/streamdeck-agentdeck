# streamdeck-agentdeck — generic config example
# Copy to ~/.config/streamdeck-agentdeck/config.toml or ~/.streamdeck-agentdeck.toml

[deck]
# SSH host for agent sessions (omit for local-only; agent runs locally)
ssh_host = "the-deck-host"

# Tool definitions: list of (display_label, shell_command) tuples.
# When ssh_host is set, each command is wrapped:
#   ssh -t <ssh_host> bash -lc '<command>'
# Labels must be short (fit on a Stream Deck key).
# To run locally (no SSH), leave ssh_host empty and put the raw command here.
tools = [
    ["claude", "claude"],
    ["glm",    "claude-glm"],
    ["gpt",    "claude-gpt"],
    ["local",  "oc-start"],
]

# Placement options: how new sessions are placed in the terminal.
# For Konsole D-Bus mode: "window", "tab", "split-right", "split-down"
# For tmux-only mode: "window" (new tmux window) or "split-right" / "split-down"
placements = [
    ["Window", "window"],
    ["Tab",    "tab"],
    ["Split →", "split-right"],
    ["Split ↓", "split-down"],
]

# Reply sets for bottom row: (name, [4 zones of (label, tmux_key_sequence)])
# Key sequences: "Up", "Down", "Enter", "Escape", "Tab", "BTab", "Space"
# Pause token: "~0.5" means sleep 0.5s before next key.
# Uses TOML array-of-tables — multi-line inline tables are INVALID TOML 1.0
# (tomllib rejects them), so the original example never parsed.
[[deck.reply_sets]]
name = "select"
zones = [
    ["1", ["Up", "Enter"]],
    ["2", ["Down", "Enter"]],
    ["3", ["Down", "Down", "Enter"]],
    ["4", ["Tab", "~0.5", "Enter"]],
]
[[deck.reply_sets]]
name = "keys"
zones = [
    ["Esc",   ["Escape"]],
    ["Space", ["Space"]],
    ["S-Tab", ["BTab"]],
    ["Voice", ["!voice"]],
]
[[deck.reply_sets]]
name = "type"
zones = [
    ["1",  ["1", "Enter"]],
    ["2",  ["2", "Enter"]],
    ["3",  ["3", "Enter"]],
    ["Esc", ["Escape"]],
]

[pruning]
# Session pruning settings
win_miss_threshold = 2        # consecutive misses before pruning a window

[weather]
# NWS weather display (the coast area by default)
# Set enabled = false to disable
enabled = true
lat = 0.0
lon = 0.0
refresh_sec = 900             # 15 minutes

[animations]
# LCD panorama mode: "normal" | "laputa" | "beach"
lcd_mode = "beach"

[paths]
# Override default paths (usually not needed)
# agent_deck_bin = "/home/username/.local/bin/agent-deck"
# cache_dir = "/home/username/.cache/agentdeck"
